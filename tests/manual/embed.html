<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Embedded test player</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; }
      video { width: 100%; height: 100%; display: block; }
      button { position: absolute; inset: 0; margin: auto; width: 140px; height: 48px; font: 600 16px system-ui; cursor: pointer; }
    </style>
  </head>
  <body>
    <!-- Mimics third-party embed players: nothing is requested until the viewer presses play. -->
    <video id="v" controls></video>
    <button id="start">▶ Play</button>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
    <script>
      document.getElementById('start').addEventListener('click', (e) => {
        e.currentTarget.remove();
        const video = document.getElementById('v');
        const hls = new Hls();
        hls.loadSource('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8');
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
      });
    </script>
  </body>
</html>

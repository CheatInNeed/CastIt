<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Castit Controller</title>
    <!-- The Cast SDK calls __onGCastApiAvailable once loaded; capture it before the SDK script runs. -->
    <script>
      window.__castitCastReady = new Promise(function (resolve) {
        window.__onGCastApiAvailable = function (available, reason) {
          resolve({ available: available, reason: reason });
        };
      });
    </script>
    <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
  </head>
  <body>
    <main class="wrap">
      <header class="bar">
        <div>
          <div class="brand">Castit Controller</div>
          <div class="muted small">Keep this tab open while casting. It talks to the Chromecast for the extension.</div>
        </div>
        <div class="pills">
          <span id="ext-status" class="pill">Extension…</span>
          <span id="device-status" class="pill">Cast…</span>
        </div>
      </header>

      <section class="card">
        <div class="eyebrow">Media</div>
        <div id="media-title" class="title">Nothing queued</div>
        <div id="media-meta" class="muted small"></div>
        <button id="choose-device" class="primary big">Choose Cast device</button>
        <p id="hint" class="muted small" hidden></p>
      </section>

      <section id="player" class="card" hidden>
        <div class="row between">
          <div class="eyebrow">Receiver<span id="player-device"></span></div>
          <span id="player-phase" class="pill"></span>
        </div>
        <div class="seek">
          <span id="time" class="mono">0:00</span>
          <input id="seek" type="range" min="0" max="0" step="1" value="0" aria-label="Seek" />
          <span id="duration" class="mono">0:00</span>
        </div>
        <div class="controls">
          <button id="back" title="Back 10 s">⟲ 10</button>
          <button id="play" class="primary" title="Play/pause">▶</button>
          <button id="fwd" title="Forward 30 s">30 ⟳</button>
          <button id="mute" title="Mute">🔊</button>
          <input id="volume" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume" />
          <button id="stop" title="Stop media">Stop</button>
          <button id="disconnect" title="End the Cast session">Disconnect</button>
        </div>
      </section>

      <div id="error" class="error" role="alert" hidden></div>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>

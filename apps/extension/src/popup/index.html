<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Castit</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <header class="bar">
      <div class="brand">Castit</div>
      <div id="connection" class="pill">…</div>
    </header>

    <section id="now" class="card" hidden>
      <div class="row between">
        <div class="eyebrow">Now casting<span id="now-device"></span></div>
        <div id="now-phase" class="pill small"></div>
      </div>
      <div id="now-title" class="title"></div>
      <div class="seek">
        <span id="now-time" class="mono">0:00</span>
        <input id="now-seek" type="range" min="0" max="0" step="1" value="0" aria-label="Seek" />
        <span id="now-duration" class="mono">0:00</span>
      </div>
      <div class="controls">
        <button id="btn-back" class="icon" title="Back 10 s" aria-label="Back 10 seconds">⟲10</button>
        <button id="btn-play" class="icon primary" title="Play/pause" aria-label="Play or pause">▶</button>
        <button id="btn-fwd" class="icon" title="Forward 30 s" aria-label="Forward 30 seconds">30⟳</button>
        <button id="btn-mute" class="icon" title="Mute" aria-label="Mute">🔊</button>
        <input id="now-volume" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume" />
        <button id="btn-stop" class="icon" title="Stop casting" aria-label="Stop casting">■</button>
      </div>
    </section>

    <section class="card">
      <div class="eyebrow">Detected media</div>
      <div id="candidates"></div>
      <p id="empty" class="muted" hidden></p>
      <button id="cast" class="cast" disabled>Cast</button>
    </section>

    <div id="notice" class="notice" role="status" hidden></div>
    <div id="error" class="error" role="alert" hidden></div>

    <details id="companion" class="card">
      <summary class="row between">
        <span class="eyebrow inline">Local companion</span>
        <span id="companion-state" class="pill small">…</span>
      </summary>
      <p id="companion-hint" class="muted small"></p>
      <form id="pair-form" class="row" hidden>
        <input id="pair-code" placeholder="123-456" inputmode="numeric" autocomplete="off" maxlength="7" aria-label="Pairing code" />
        <button id="pair-btn" type="submit" class="icon primary">Pair</button>
      </form>
      <label class="row small field">
        Casting method
        <select id="engine-mode">
          <option value="auto">Automatic (direct, companion when needed)</option>
          <option value="direct">Direct only</option>
          <option value="companion">Always via companion</option>
        </select>
      </label>
      <button id="companion-forget" class="link small" hidden>Forget pairing</button>
    </details>

    <footer class="footer">
      <button id="open-controller" class="link">Open controller</button>
      <span class="muted">Casts the stream itself, never the tab.</span>
    </footer>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
